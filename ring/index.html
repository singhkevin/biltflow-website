<!doctype html><html><head><meta charset="utf-8"><title>Antigravity ring — reverse-engineered</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F9FAFB;
    font:12px ui-monospace,'IBM Plex Mono',Menlo,monospace;color:#12161B}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:14px;left:14px;z-index:10;background:#fff;border:1px solid #C9D0D7;padding:12px 14px;width:260px}
  #ui h1{font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:#59636E;font-weight:500}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:11px}
  input[type=range]{width:120px;accent-color:#FF5500}
  b{font-variant-numeric:tabular-nums;color:#59636E;font-weight:500;min-width:44px;text-align:right}
  .row{display:flex;gap:6px;margin-top:10px}
  button{flex:1;font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    background:#fff;border:1px solid #C9D0D7;padding:6px 0;cursor:pointer;color:#12161B}
  button.on{background:#12161B;color:#F9FAFB;border-color:#12161B}
  #hint{position:fixed;bottom:16px;left:16px;color:#59636E;font-size:11px;z-index:10}
</style></head><body>
<div id="ui">
  <h1>Ring — antigravity.google</h1>
  <label>ring width <input id="w1" type="range" min="0.01" max="0.20" step="0.005" value="0.05"><b id="w1v">0.050</b></label>
  <label>inner width <input id="w2" type="range" min="0.004" max="0.06" step="0.002" value="0.015"><b id="w2v">0.015</b></label>
  <label>displacement <input id="dp" type="range" min="0" max="3" step="0.05" value="1.0"><b id="dpv">1.00</b></label>
  <label>follow ease <input id="ez" type="range" min="0.003" max="0.20" step="0.002" value="0.02"><b id="ezv">0.020</b></label>
  <label>cursor reach <input id="rc" type="range" min="0.05" max="1" step="0.005" value="0.175"><b id="rcv">0.175</b></label>
  <label>particle size <input id="ps" type="range" min="0.3" max="3" step="0.05" value="1"><b id="psv">1.00</b></label>
  <div class="row">
    <button id="pLight" class="on">google light</button>
    <button id="pDark">google dark</button>
    <button id="pBilt">biltflow</button>
  </div>
</div>
<div id="hint">move the cursor — the ring lags by design (lerp 0.02/frame ≈ 0.8s)</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------- Poisson-disc (Bridson) — how antigravity seeds the rest positions ---------- */
function poisson(w,h,r,k=20){
  const cell=r/Math.SQRT2, gw=Math.ceil(w/cell), gh=Math.ceil(h/cell);
  const grid=new Int32Array(gw*gh).fill(-1), pts=[], active=[];
  const add=p=>{const i=pts.length;pts.push(p);active.push(i);
    grid[(p[1]/cell|0)*gw+(p[0]/cell|0)]=i;};
  add([Math.random()*w,Math.random()*h]);
  while(active.length){
    const ai=Math.random()*active.length|0, p=pts[active[ai]]; let placed=false;
    for(let i=0;i<k;i++){
      const a=Math.random()*Math.PI*2, d=r*(1+Math.random());
      const q=[p[0]+Math.cos(a)*d, p[1]+Math.sin(a)*d];
      if(q[0]<0||q[0]>=w||q[1]<0||q[1]>=h) continue;
      const gx=q[0]/cell|0, gy=q[1]/cell|0; let ok=true;
      for(let y=Math.max(0,gy-2);y<=Math.min(gh-1,gy+2)&&ok;y++)
        for(let x=Math.max(0,gx-2);x<=Math.min(gw-1,gx+2);x++){
          const j=grid[y*gw+x]; if(j<0) continue;
          const dx=pts[j][0]-q[0], dy=pts[j][1]-q[1];
          if(dx*dx+dy*dy<r*r){ok=false;break;}
        }
      if(ok){add(q);placed=true;break;}
    }
    if(!placed) active.splice(ai,1);
  }
  return pts;
}

/* ---------- Ashima simplex noise, the `snoise` the shaders call ---------- */
const SNOISE=`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
const PR=Math.min(window.devicePixelRatio,2);
renderer.setPixelRatio(PR); renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

let aspect=innerWidth/innerHeight;
const camera=new THREE.OrthographicCamera(-aspect,aspect,1,-1,0,10); camera.position.z=1;
const scene=new THREE.Scene();

/* ---------- GPGPU ping-pong, 256x256 like the original ---------- */
const SIZE=256, LEN=SIZE*SIZE;
const pts=poisson(500,500,5.0);
const data=new Float32Array(LEN*4);
const N=Math.min(pts.length,LEN);
for(let i=0;i<N;i++){ data[i*4]=(pts[i][0]-250)/250; data[i*4+1]=(pts[i][1]-250)/250; }
const posTex=new THREE.DataTexture(data,SIZE,SIZE,THREE.RGBAFormat,THREE.FloatType);
posTex.needsUpdate=true;

const rtOpts={wrapS:THREE.ClampToEdgeWrapping,wrapT:THREE.ClampToEdgeWrapping,
  minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,
  format:THREE.RGBAFormat,type:THREE.FloatType,depthBuffer:false,stencilBuffer:false};
let rt1=new THREE.WebGLRenderTarget(SIZE,SIZE,rtOpts), rt2=new THREE.WebGLRenderTarget(SIZE,SIZE,rtOpts);

const simScene=new THREE.Scene(), simCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const simMat=new THREE.ShaderMaterial({
  uniforms:{uPosition:{value:posTex},uPosRefs:{value:posTex},uRingPos:{value:new THREE.Vector2()},
    uRingRadius:{value:.2},uRingWidth:{value:.05},uRingWidth2:{value:.015},
    uRingDisplacement:{value:1.0},uTime:{value:0},uDeltaTime:{value:0}},
  vertexShader:`void main(){gl_Position=vec4(position,1.0);}`,
  fragmentShader:`precision highp float;
  uniform sampler2D uPosition,uPosRefs; uniform vec2 uRingPos;
  uniform float uTime,uDeltaTime,uRingRadius,uRingWidth,uRingWidth2,uRingDisplacement;
  ${SNOISE}
  void main(){
    vec2 st=gl_FragCoord.xy/vec2(${SIZE}.0,${SIZE}.0);
    vec4 pFrame=texture2D(uPosition,st);
    float scale=pFrame.z, velocity=pFrame.w;
    vec2 refPos=texture2D(uPosRefs,st).xy;
    float time=uTime*.5;
    vec2 curentPos=refPos;
    vec2 pos=pFrame.xy; pos*=.8;                       // <- decay home each frame

    float dist=distance(curentPos,uRingPos);
    float noise0=snoise(vec3(curentPos*.2+vec2(18.4924,72.9744),time*0.5));
    float dist1=distance(curentPos+(noise0*.005),uRingPos);

    float t =smoothstep(uRingRadius-(uRingWidth*2.),uRingRadius,dist)
            -smoothstep(uRingRadius,uRingRadius+uRingWidth,dist1);
    float t2=smoothstep(uRingRadius-(uRingWidth2*2.),uRingRadius,dist)
            -smoothstep(uRingRadius,uRingRadius+uRingWidth2,dist1);
    float t3=smoothstep(uRingRadius+uRingWidth2,uRingRadius,dist);
    t=pow(t,2.); t2=pow(t2,3.);
    t+=t2*3.; t+=t3*.4;
    t+=snoise(vec3(curentPos*30.+vec2(11.4924,12.9744),time*0.5))*t3*.5;
    float nS=snoise(vec3(curentPos*2.+vec2(18.4924,72.9744),time*0.5));
    t+=pow((nS+1.5)*.5,2.)*.6;

    float n1=snoise(vec3(curentPos*4.+vec2(88.494,32.4397),time*0.35));
    float n2=snoise(vec3(curentPos*4.+vec2(50.904,120.947),time*0.35));
    float n3=snoise(vec3(curentPos*20.+vec2(18.4924,72.9744),time*.5));
    float n4=snoise(vec3(curentPos*20.+vec2(50.904,120.947),time*.5));
    vec2 disp=vec2(n1,n2)*.03; disp+=vec2(n3,n4)*.005;
    disp.x+=sin((refPos.x*20.)+(time*4.))*.02*clamp(dist,0.,1.);
    disp.y+=cos((refPos.y*20.)+(time*3.))*.02*clamp(dist,0.,1.);

    pos-=(uRingPos-(curentPos+disp))*pow(t2,.75)*uRingDisplacement;
    scale+=(t-scale)*.2;
    vec2 finalPos=curentPos+disp+(pos*.25);
    velocity*=.5; velocity+=scale*.25;
    gl_FragColor=vec4(finalPos,scale,velocity);
  }`
});
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),simMat));

/* ---------- points ---------- */
const geo=new THREE.BufferGeometry();
const posA=new Float32Array(LEN*3), uvA=new Float32Array(LEN*2), seeds=new Float32Array(LEN*4);
for(let i=0;i<LEN;i++){
  uvA[i*2]=((i%SIZE)+.5)/SIZE; uvA[i*2+1]=((i/SIZE|0)+.5)/SIZE;
  for(let s=0;s<4;s++) seeds[i*4+s]=Math.random();
}
geo.setAttribute('position',new THREE.BufferAttribute(posA,3));
geo.setAttribute('uv',new THREE.BufferAttribute(uvA,2));
geo.setAttribute('seeds',new THREE.BufferAttribute(seeds,4));

const PALETTES={
  light:{c1:'#2c64ed',c2:'#f84242',c3:'#ffcf03',bg:'#ffffff',scheme:1},
  dark :{c1:'#7189ff',c2:'#3074f9',c3:'#000000',bg:'#000000',scheme:0},
  bilt :{c1:'#FF5500',c2:'#C43D00',c3:'#12161B',bg:'#F9FAFB',scheme:1}
};
const renderMat=new THREE.ShaderMaterial({
  transparent:true,depthTest:false,depthWrite:false,
  uniforms:{uPosition:{value:null},uTime:{value:0},
    uColor1:{value:new THREE.Color(PALETTES.light.c1)},
    uColor2:{value:new THREE.Color(PALETTES.light.c2)},
    uColor3:{value:new THREE.Color(PALETTES.light.c3)},
    uAlpha:{value:1},uRingPos:{value:new THREE.Vector2()},
    uRez:{value:new THREE.Vector2(innerWidth*PR,innerHeight*PR)},
    uParticleScale:{value:1},uPixelRatio:{value:PR},uColorScheme:{value:1}},
  vertexShader:`precision highp float;
    attribute vec4 seeds; uniform sampler2D uPosition;
    uniform float uParticleScale,uPixelRatio;
    varying vec4 vSeeds; varying float vVelocity,vScale; varying vec2 vLocalPos,vScreenPos;
    void main(){
      vec4 pos=texture2D(uPosition,uv);
      vSeeds=seeds; vVelocity=pos.w; vScale=pos.z; vLocalPos=pos.xy;
      vec4 viewSpace=modelViewMatrix*vec4(vec3(pos.xy,0.),1.0);
      gl_Position=projectionMatrix*viewSpace;
      vScreenPos=gl_Position.xy;
      gl_PointSize=((vScale*7.)*(uPixelRatio*0.5)*uParticleScale);
    }`,
  fragmentShader:`precision highp float;
    varying vec4 vSeeds; varying vec2 vScreenPos,vLocalPos; varying float vScale,vVelocity;
    uniform vec3 uColor1,uColor2,uColor3; uniform vec2 uRingPos,uRez;
    uniform float uAlpha,uTime; uniform int uColorScheme;
    ${SNOISE}
    float sdRoundBox(in vec2 p,in vec2 b,in vec4 r){
      r.xy=(p.x>0.0)?r.xy:r.zw; r.x=(p.y>0.0)?r.x:r.y;
      vec2 q=abs(p)-b+r.x; return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r.x;}
    vec2 rotate(vec2 v,float a){float s=sin(a),c=cos(a);return mat2(c,s,-s,c)*v;}
    void main(){
      float uBorderSize=0.2; float ratio=uRez.x/uRez.y;
      float noiseAngle=snoise(vec3(vLocalPos*10.+vec2(18.4924,72.9744),uTime*.85));
      float noiseColor=snoise(vec3(vLocalPos*2.+vec2(74.664,91.556),uTime*.5));
      noiseColor=(noiseColor+1.)*.5;
      float angle=atan(vLocalPos.y-uRingPos.y,vLocalPos.x-uRingPos.x);
      vec2 uv=gl_PointCoord.xy-vec2(0.5); uv.y*=-1.;
      uv=rotate(uv,-angle+(noiseAngle*.5));
      float h=0.8;
      float progress=smoothstep(0.,.75,pow(noiseColor,2.));
      vec3 col=mix(mix(uColor1,uColor2,progress/h),mix(uColor2,uColor3,(progress-h)/(1.0-h)),step(h,progress));
      float rounded=sdRoundBox(uv,vec2(0.5,0.2),vec4(.25));
      rounded=smoothstep(.1,0.,rounded);
      float a=uAlpha*rounded*smoothstep(0.1,0.2,vScale);
      if(a<0.01) discard;
      vec3 color=clamp(col,0.,1.);
      color=mix(color,color*clamp(vVelocity,0.,1.),float(uColorScheme));
      gl_FragColor=vec4(color,clamp(a,0.,1.));
    }`
});
scene.add(new THREE.Points(geo,renderMat));

/* ---------- the follow behaviour ---------- */
const cursor=new THREE.Vector2(), ring=new THREE.Vector2();
let over=false, px=0, py=0;
addEventListener('pointermove',e=>{
  over=true;
  px=(e.clientX/innerWidth)*2-1; py=-((e.clientY/innerHeight)*2-1);
});
addEventListener('pointerleave',()=>over=false);

// cheap 1D value noise for the idle wander
const seedTab=Array.from({length:512},()=>Math.random());
const vnoise=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);
  return seedTab[i&511]*(1-u)+seedTab[(i+1)&511]*u;};

const clock=new THREE.Clock();
let ever=false;
const P={ease:0.02,reach:0.175,pscale:1};

function frame(){
  requestAnimationFrame(frame);
  const t=clock.getElapsedTime();
  const nx=(vnoise(t*0.66+94.234)-.5)*2, ny=(vnoise(t*0.75+21.028)-.5)*2;

  if(over){ cursor.set(px*aspect*P.reach+nx*.1, py*P.reach+ny*.1);
            ring.x+=(cursor.x-ring.x)*P.ease; ring.y+=(cursor.y-ring.y)*P.ease; }
  else    { cursor.set(nx*.2, ny*.1);
            ring.x+=(cursor.x-ring.x)*(P.ease*.5); ring.y+=(cursor.y-ring.y)*(P.ease*.5); }

  simMat.uniforms.uPosition.value = ever ? rt1.texture : posTex;
  simMat.uniforms.uTime.value=t;
  simMat.uniforms.uRingRadius.value=.175+Math.sin(t)*.03+Math.cos(t*3)*.02;  // breathing
  simMat.uniforms.uRingPos.value.copy(ring);

  renderer.setRenderTarget(rt2); renderer.render(simScene,simCam); renderer.setRenderTarget(null);
  const tmp=rt1; rt1=rt2; rt2=tmp; ever=true;

  renderMat.uniforms.uPosition.value=rt1.texture;
  renderMat.uniforms.uTime.value=t;
  renderMat.uniforms.uRingPos.value.copy(ring);
  renderMat.uniforms.uParticleScale.value=(renderer.domElement.width/PR/2000)*8*P.pscale;
  renderer.render(scene,camera);
}
frame();

addEventListener('resize',()=>{
  aspect=innerWidth/innerHeight;
  camera.left=-aspect;camera.right=aspect;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderMat.uniforms.uRez.value.set(innerWidth*PR,innerHeight*PR);
});

/* ---------- controls ---------- */
const bind=(id,fn,dp=3)=>{const el=document.getElementById(id),out=document.getElementById(id+'v');
  const go=()=>{const v=parseFloat(el.value);out.textContent=v.toFixed(dp);fn(v);};el.oninput=go;go();};
bind('w1',v=>simMat.uniforms.uRingWidth.value=v);
bind('w2',v=>simMat.uniforms.uRingWidth2.value=v);
bind('dp',v=>simMat.uniforms.uRingDisplacement.value=v,2);
bind('ez',v=>P.ease=v);
bind('rc',v=>P.reach=v);
bind('ps',v=>P.pscale=v,2);
const btns={pLight:'light',pDark:'dark',pBilt:'bilt'};
Object.entries(btns).forEach(([id,key])=>{
  document.getElementById(id).onclick=()=>{
    const p=PALETTES[key];
    renderMat.uniforms.uColor1.value.set(p.c1);
    renderMat.uniforms.uColor2.value.set(p.c2);
    renderMat.uniforms.uColor3.value.set(p.c3);
    renderMat.uniforms.uColorScheme.value=p.scheme;
    document.body.style.background=p.bg;
    document.querySelectorAll('.row button').forEach(b=>b.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  };
});
</script></body></html>
