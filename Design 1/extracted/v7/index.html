<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ═══ THE BEAT ══════════════════════════════════════════════════════════════
   Scroll 0 -> 1 is the SITE beat: an empty lot on a ground datum, the setting-out
   lines, the core footprint drawing itself, then the first structure standing up.
   Everything is revealed by a single build front (uBuild) compared against a
   per-vertex aBuild — no geometry is added or removed, so the whole story costs
   one attribute and one uniform. That is the mechanism the full 7-beat concept
   would use end to end. */

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lowPower = matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency||8) <= 4;

/* ── palette — identical to /v6, nothing invented ── */
const C = {
  stream: { hex:'#2E38FF', a:0.70, r:0.017, heat:0.85 },   // the live layer
  tick:   { hex:'#DDE2F2', a:0.50, r:0.012, heat:0 },     // white drafting
  set:    { hex:'#9AA0FF', a:0.62, r:0.016, heat:0 },     // setting-out
  plan:   { hex:'#F7F9FA', a:0.92, r:0.018, heat:0 },     // footprint
  frame:  { hex:'#7A84D8', a:0.72, r:0.016, heat:0 },     // structure
  lit:    { hex:'#FFFFFF', a:1.00, r:0.015, heat:1.15 },  // occupied — the payoff
  grid:   { hex:'#5A63A8', a:0.52, r:0.018, heat:0 },    // ground datum
};

/* ── site + structure, all on a ground plane at y=0 ────────────────────────
   A building reads as a BUILDING because of its repeating members — a column
   grid, floor plates with internal beams, a façade module at a regular rhythm,
   a core. Six corner edges and a ring per level is a prism, not a structure.
   The façade is deliberately sequenced a few levels BEHIND the frame, which is
   how cladding actually follows structure up a real job. ── */
const items = [];
// retire: the point the element LEAVES (0 = never). late: how far it dims once the
// building is in use. Together these are what turn a build-up into a full lifecycle —
// construction has to end, not just accumulate.
const push = (cls, pts, build = 0, retire = 0, late = 0) => items.push({ cls, pts, build, retire, late });
const GX = 34, ZN = 14, ZF = -210;

// Ground datum — the floor that makes this a place rather than a void.
for (let z = ZN; z > ZF; z -= 9) push('grid', [[-GX,0,z],[GX,0,z]]);
for (let x = -GX; x <= GX; x += 9) push('grid', [[x,0,ZN],[x,0,ZF]]);

// The lot.
const CX = 2, CZ = -62;
const B = [[-20,-24],[26,-24],[26,-100],[-20,-100]];
for (let i = 0; i < 4; i++) push('tick', [[B[i][0],0,B[i][1]],[B[(i+1)%4][0],0,B[(i+1)%4][1]]], 0.015, 0, 0.6);
push('set', [[-GX,0,CZ],[GX,0,CZ]], 0.05);
push('set', [[CX,0,ZN],[CX,0,ZF]], 0.05);
for (let z = -28; z >= -98; z -= 8) push('tick', [[CX-1.6,0,z],[CX+1.6,0,z]], 0.07);

// ── the building ──────────────────────────────────────────────────────────
const LV = 17, H = 3.3, NX = 6, NZ = 4;
const PODIUM = 6;                                  // setback from podium to tower
const plan = k => k < PODIUM ? { w: 15, d: 10 } : { w: 10.5, d: 7 };
const at = (k, i, j) => { const { w, d } = plan(k);
  return [CX - w + 2*w*i/(NX-1), k*H, CZ - d + 2*d*j/(NZ-1)]; };
// structure at level k lands at this point on the front; cladding trails it.
const tF = k => 0.36 + (k / LV) * 0.28;                 // structure  36% -> 64%
const tC = k => Math.min(0.99, tF(k) + 0.09);           // cladding trails it
const tL = k => 0.78 + (k / LV) * 0.12;                 // occupied   78% -> 90%

for (let k = 0; k < LV; k++) {
  const b = tF(k), { w, d } = plan(k), y0 = k*H, y1 = (k+1)*H;

  // COLUMNS — one segment per level, so the frame rises storey by storey.
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ; j++) {
    const p = at(k, i, j);
    push('frame', [[p[0], y0, p[2]], [p[0], y1, p[2]]], b, 0, 0.35);
  }
  // FLOOR PLATE — perimeter as a double line (slab thickness) + internal beams.
  const C = [at(k,0,0), at(k,NX-1,0), at(k,NX-1,NZ-1), at(k,0,NZ-1)];
  for (const dy of [0, 0.42]) for (let i = 0; i < 4; i++)
    push(dy ? 'frame' : 'plan', [[C[i][0], y1+dy, C[i][2]], [C[(i+1)%4][0], y1+dy, C[(i+1)%4][2]]], b + 0.004, 0, dy?0.55:0.2);
  for (let i = 0; i < NX; i++) push('frame', [[at(k,i,0)[0], y1, CZ-d], [at(k,i,0)[0], y1, CZ+d]], b + 0.006, 0, 0.5);
  for (let j = 0; j < NZ; j++) push('frame', [[CX-w, y1, at(k,0,j)[2]], [CX+w, y1, at(k,0,j)[2]]], b + 0.006, 0, 0.5);

  // CORE — lift/stair walls, drawn denser, with X-bracing every level.
  const cw = 3.4, cd = 2.6;
  const K = [[CX-cw,CZ-cd],[CX+cw,CZ-cd],[CX+cw,CZ+cd],[CX-cw,CZ+cd]];
  for (let i = 0; i < 4; i++) {
    push('plan', [[K[i][0], y0, K[i][1]], [K[i][0], y1, K[i][1]]], b);
    push('plan', [[K[i][0], y1, K[i][1]], [K[(i+1)%4][0], y1, K[(i+1)%4][1]]], b + 0.004);
  }
  push('set', [[K[0][0], y0, K[0][1]], [K[1][0], y1, K[1][1]]], b + 0.008, 0, 0.8);
  push('set', [[K[1][0], y0, K[1][1]], [K[0][0], y1, K[0][1]]], b + 0.008, 0, 0.8);

  // OCCUPANCY — the building comes into use. This is the beat the whole sequence is for:
  // the record does not stop at handover.
  if (k % 2 === 0 && k < LV - 1) {
    const L = tL(k), MOD = 2.3, yl = y0 + H*0.45;
    for (let x = CX - w + MOD; x < CX + w - 0.1; x += MOD*2)
      push('lit', [[x, yl, CZ+d], [x + MOD*0.62, yl, CZ+d]], L + Math.abs(Math.sin(x*7.3+k))*0.05);
    for (let z = CZ - d + MOD; z < CZ + d - 0.1; z += MOD*2)
      push('lit', [[CX-w, yl, z], [CX-w, yl, z + MOD*0.62]], L + Math.abs(Math.sin(z*5.1+k))*0.05);
  }

  // FAÇADE — vertical mullions on the two visible faces at a fixed module.
  // Trails the frame by tC-tF, so you watch cladding chase the structure up.
  if (k < LV - 1) {
    const c = tC(k), MOD = 2.3;
    for (let x = CX - w + MOD; x < CX + w - 0.1; x += MOD)
      push('tick', [[x, y0+0.42, CZ+d], [x, y1, CZ+d]], c);
    for (let z = CZ - d + MOD; z < CZ + d - 0.1; z += MOD)
      push('tick', [[CX-w, y0+0.42, z], [CX-w, y1, z]], c);
  }
}

// ── tower crane: goes up early, comes DOWN before handover ──
// Dismantling it top-down is what makes the end of the sequence read as completion
// rather than as the animation simply stopping.
const MX = CX - 20, MZ = CZ + 4, MH = LV*H + 12;
const Q = [[-1.3,-1.3],[1.3,-1.3],[1.3,1.3],[-1.3,1.3]];
for (const [ox, oz] of Q) push('frame', [[MX+ox,0,MZ+oz],[MX+ox,MH,MZ+oz]], 0.10, 0.88);
for (let y = 3; y < MH; y += 3.4)
  for (let i = 0; i < 4; i++)
    push('frame', [[MX+Q[i][0],y,MZ+Q[i][1]],[MX+Q[(i+1)%4][0],y,MZ+Q[(i+1)%4][1]]],
         0.10 + (y/MH)*0.16, 0.88 - (y/MH)*0.06);   // laces come off from the top down
push('plan', [[MX,MH,MZ],[MX+34,MH,MZ]], 0.15, 0.80);          // jib
push('plan', [[MX,MH,MZ],[MX-11,MH,MZ]], 0.15, 0.80);          // counter-jib
push('set',  [[MX,MH+5,MZ],[MX+34,MH,MZ]], 0.16, 0.80);        // pendants
push('set',  [[MX,MH+5,MZ],[MX-11,MH,MZ]], 0.16, 0.80);
push('frame',[[MX,MH,MZ],[MX,MH+5,MZ]], 0.16, 0.81);           // A-frame
push('tick', [[MX+21,MH,MZ],[MX+21,MH-13,MZ]], 0.17, 0.78);    // hoist line

// ── streams: arrive across the ground, then climb the core ──
const N_STREAM = lowPower ? 5 : 9;
for (let i = 0; i < N_STREAM; i++) {
  const a = (i/N_STREAM)*Math.PI*2, lx = CX + Math.cos(a)*3.2, lz = CZ + Math.sin(a)*2.4;
  const off = (i/N_STREAM - 0.5) * 30, pts = [];
  for (let j = 0; j <= 46; j++) {
    const t = j/46;
    if (t < 0.45) { const e = (t/0.45), s = e*e*(3-2*e);
      pts.push([off + (lx-off)*s, 0, ZF + (lz-ZF)*s]); }
    else { const s = (t-0.45)/0.55; pts.push([lx, s*s*(LV*H), lz]); }
  }
  push('stream', pts, 0.09 + i*0.018);
}

/* ── curve + build ── */
class Poly extends THREE.Curve {
  constructor(p){ super(); this.p = p.map(q => new THREE.Vector3(q[0],q[1],q[2])); this.arcLengthDivisions = Math.max(200, p.length*4); }
  getPoint(t, o = new THREE.Vector3()){
    const n = this.p.length-1, i = Math.min(n-1, Math.floor(t*n));
    return o.copy(this.p[i]).lerp(this.p[i+1], (t - i/n) * n);
  }
}

const VERT = `
uniform float uViewportH, uTanHalfFov, uMinPx;
attribute vec3 aColor; attribute vec4 aWave; attribute vec2 aFade, aSeq; attribute float aRadius, aBuild;
varying vec3 vColor; varying vec4 vWave; varying vec2 vFade;
varying float vDepth, vWidthFade, vBuild; varying vec2 vUvL, vSeq;
void main(){
  vUvL = uv; vColor = aColor; vWave = aWave; vFade = aFade; vBuild = aBuild; vSeq = aSeq;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vDepth = -mv.z;
  float pxPerUnit = uViewportH / (2.0 * vDepth * uTanHalfFov);
  float wantR = max(aRadius, uMinPx / (2.0 * pxPerUnit));
  mv.xyz += normalize(normalMatrix * normal) * (wantR - aRadius);
  vWidthFade = aRadius / wantR;
  gl_Position = projectionMatrix * mv;
}`;

const FRAG = `
uniform float uTime, uBuild, uFogNear, uFogFar, uNearCull;
uniform vec2 uResolution, uMaskStops;
varying vec3 vColor; varying vec4 vWave; varying vec2 vFade;
varying float vDepth, vWidthFade, vBuild; varying vec2 vUvL, vSeq;
void main(){
  // THE BUILD FRONT. One comparison turns the whole scene into a sequence: geometry
  // only exists once the front has passed the level it belongs to. Nothing is added
  // or removed at runtime — this is the entire storytelling mechanism.
  // The front starts slightly AHEAD of zero, otherwise smoothstep(0, .035, 0) discards
  // even the ground datum and the beat opens on an empty frame.
  float front = uBuild * 0.86 + 0.14;
  float born = smoothstep(vBuild, vBuild + 0.035, front);
  if (born <= 0.001) discard;
  // A brief flash as each element lands, so the drawing reads as being DRAWN.
  float ink = 1.0 + 2.4 * exp(-pow((front - vBuild) * 26.0, 2.0));

  float phase = vUvL.x * vWave.x - uTime * vWave.y + vWave.z;
  float pulse = smoothstep(-0.5, 0.5, sin(phase)) * step(0.5, vWave.y);
  float statMod = mix(0.76 + 0.24 * sin(vUvL.x * vWave.x * 0.5 + vWave.z), 1.0, step(0.5, vWave.y));

  float fogF  = 1.0 - smoothstep(uFogNear, uFogFar, vDepth);
  float nearF = smoothstep(uNearCull, uNearCull + 9.0, vDepth);
  float hide  = smoothstep(0.0, vFade.y, vUvL.x) * smoothstep(1.0, 0.94, vUvL.x);

  float sy = 1.0 - (gl_FragCoord.y / uResolution.y);
  float mask = 1.0 - 0.22 * smoothstep(uMaskStops.x, uMaskStops.y, sy);

  vec3 col = vColor * ink + pulse * vWave.w;
  // The crane comes down; the temporary works go with it.
  float gone = (vSeq.x > 0.0) ? 1.0 - smoothstep(vSeq.x, vSeq.x + 0.05, front) : 1.0;
  // Once the building is in use the construction layer recedes and the record keeps running.
  float late = 1.0 - vSeq.y * smoothstep(0.84, 0.96, front);
  float a = vFade.x * hide * fogF * nearF * vWidthFade * statMod * mask * born * gone * late;
  gl_FragColor = vec4(col * fogF, a);
}`;

const geos = [];
const radial = lowPower ? 3 : 5;
items.forEach((it, idx) => {
  const K = C[it.cls], curve = new Poly(it.pts), len = curve.getLength();
  if (!(len > 0.01)) return;
  const seg = it.cls === 'stream' ? (lowPower ? 90 : 200) : Math.max(2, Math.min(40, Math.round(len/3)));
  const g = new THREE.TubeGeometry(curve, seg, K.r, radial, false);
  const n = g.attributes.position.count;
  const col = new THREE.Color(K.hex);
  const put = (name, size, fn) => {
    const arr = new Float32Array(n*size);
    for (let v = 0; v < n; v++) fn(arr, v*size);
    g.setAttribute(name, new THREE.BufferAttribute(arr, size));
  };
  const uSize = 2*Math.PI*len/16, phase = idx*2.399963;
  const speed = it.cls === 'stream' ? 1 : 0;
  put('aColor', 3, (a,o)=>{ a[o]=col.r; a[o+1]=col.g; a[o+2]=col.b; });
  put('aWave', 4, (a,o)=>{ a[o]=uSize; a[o+1]=speed; a[o+2]=phase; a[o+3]=K.heat; });
  put('aFade', 2, (a,o)=>{ a[o]=K.a; a[o+1]=Math.min(0.4, 16/len); });
  put('aRadius', 1, (a,o)=>{ a[o]=K.r; });
  put('aBuild', 1, (a,o)=>{ a[o]=it.build; });
  put('aSeq', 2, (a,o)=>{ a[o]=it.retire||0; a[o+1]=it.late||0; });
  geos.push(g);
});

const mat = new THREE.ShaderMaterial({
  vertexShader: VERT, fragmentShader: FRAG, transparent: true,
  depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: {
    uTime:{value:0}, uBuild:{value:0}, uFogNear:{value:80}, uFogFar:{value:300}, uNearCull:{value:1.5},
    uResolution:{value:new THREE.Vector2(1,1)}, uMaskStops:{value:new THREE.Vector2(0.58,0.86)},
    uViewportH:{value:1}, uTanHalfFov:{value:Math.tan(19*Math.PI/180)}, uMinPx:{value:1.15},
  },
});
const mesh = new THREE.Mesh(mergeGeometries(geos, false), mat);
mesh.frustumCulled = false;
geos.forEach(g => g.dispose());

/* ── composite pass: same grammar as /v6 ── */
const COMP = {
  uniforms:{ tDiffuse:{value:null}, uAspect:{value:1}, uTime:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
uniform sampler2D tDiffuse; uniform float uAspect, uTime; varying vec2 vUv;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453123); }
float sIO(float t){ return -0.5*(cos(3.14159265*t)-1.0); }
void main(){
  vec4 c = texture2D(tDiffuse, vUv);
  c.rgb += vec3(0.0180,0.0245,0.2100) * sIO(clamp(1.0-distance(vec2(0.68,0.54),vUv)*1.02,0.0,1.0)) * 0.60;
  c.rgb += vec3(0.0320,0.0420,0.3400) * sIO(clamp(1.0-distance(vec2(0.68,0.54),vUv)*0.24,0.0,1.0)) * 0.42;
  c.rgb *= mix(1.0, 0.78, smoothstep(0.22,0.0,vUv.y)*0.88);
  c.rgb *= mix(1.0, smoothstep(0.95,0.26,length((vUv-0.5)*vec2(uAspect,1.0))), 0.55);
  float tq = floor(uTime*12.0)/12.0;
  c.rgb += (hash(gl_FragCoord.xy + tq*91.7)-0.5)*0.014 + (hash(gl_FragCoord.xy*1.7)-0.5)*0.018;
  gl_FragColor = c;
}`,
};

/* ── renderer ── */
const host = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:false, stencil:false, depth:false });
const dpr = Math.min(devicePixelRatio||1, lowPower?1.25:1.5);
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor('#05070A', 1);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene(); scene.add(mesh);
// Zero rotation + principal-point offset, exactly as /v6 — verticals stay plumb and
// the vanishing point cannot drift. Eye is above the ground plane looking level.
const cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.5, 900);
cam.position.set(0, 12.0, 44);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth/2, innerHeight/2), 0.55, 0.32, 0.78);
composer.addPass(bloom);
const comp = new ShaderPass(COMP); composer.addPass(comp);
composer.addPass(new OutputPass());

function frame(){
  const w = innerWidth, h = innerHeight;
  cam.aspect = w/h;
  cam.setViewOffset(w, h, w*(0.5-0.72), h*(0.5-0.54), w, h);
  cam.updateProjectionMatrix();
  mat.uniforms.uResolution.value.set(w*dpr, h*dpr);
  mat.uniforms.uViewportH.value = h*dpr;
  comp.uniforms.uAspect.value = w/h;
}
frame();

const STAGES = [
  [0.00,'01','Site sourcing'], [0.05,'02','Feasibility'],   [0.11,'03','Design'],
  [0.16,'04','Approvals'],     [0.21,'05','Procurement'],   [0.27,'06','Enabling works'],
  [0.32,'07','Substructure'],  [0.38,'08','Structure'],     [0.58,'09','Façade'],
  [0.70,'10','Services'],      [0.78,'11','Fit-out'],       [0.88,'12','Handover'],
  [0.95,'13','Operation'],
];
const noEl = document.getElementById('stageNo'), nmEl = document.getElementById('stageName'), barEl = document.getElementById('stageBar');
let shown = -1, t = 0, last = performance.now(), build = 0, docH = 1;
const measure = () => { docH = Math.max(1, document.documentElement.scrollHeight - innerHeight); };
measure();

function tick(now){
  if (now - last < 15.5) return;
  t += Math.min(now - last, 33) * 0.001; last = now;
  const p = Math.min(1, Math.max(0, scrollY / docH));
  build += (p - build) * 0.09;
  mat.uniforms.uBuild.value = build;
  mat.uniforms.uTime.value = t * 0.85;
  comp.uniforms.uTime.value = t;
  // The camera lifts and pulls back as the tower stands up, so the subject stays framed.
  // Rises with the building, then keeps pulling back so the finished tower reads whole.
  cam.position.set(0, 12.0 + build*26, 44 + build*48);
  let i = 0; for (let k = 0; k < STAGES.length; k++) if (build >= STAGES[k][0]) i = k;
  if (i !== shown) { shown = i; noEl.textContent = STAGES[i][1]; nmEl.textContent = STAGES[i][2]; }
  barEl.style.width = (build*132).toFixed(1) + 'px';
  composer.render();
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); frame(); measure(); }, { passive:true });

await renderer.compileAsync(scene, cam);
composer.render();
renderer.domElement.style.opacity = '1';
if (reduce) { mat.uniforms.uBuild.value = 1; composer.render(); }
else renderer.setAnimationLoop(tick);
window.__concept = 'ok:' + items.length;
window.__d = { scene, cam, mesh, mat, composer, renderer, items, THREE };
